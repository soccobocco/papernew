<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRSCRIPT · 방송 원고 자동검수 & STOCK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
/* ============= RESET ============= */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: #050914;
  color: #e2e8f0;
  line-height: 1.6;
  overflow: hidden;
}

/* ============= UTILS ============= */
.serif { font-family: 'Noto Serif KR', serif; font-feature-settings: "palt"; }
.mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
.display { font-family: 'Inter', 'Noto Sans KR', sans-serif; }

.text-cyan { color: #22d3ee; }
.text-hcyan { color: #00B4D8; }
.text-hblue { color: #4a90d9; }
.text-amber { color: #fbbf24; }
.text-red { color: #f87171; }
.text-emerald { color: #34d399; }
.text-muted { color: #94a3b8; }
.text-mute2 { color: #64748b; }

.scroll-y { overflow-y: auto; }
.scroll-y::-webkit-scrollbar { width: 8px; }
.scroll-y::-webkit-scrollbar-track { background: transparent; }
.scroll-y::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
.scroll-y::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

/* ============= LAYOUT ============= */
.app { display: flex; height: 100vh; }
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: #0a1128;
  border-right: 1px solid rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
}
.main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* ============= SIDEBAR ============= */
.brand-block {
  padding: 20px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: #22d3ee;
  margin-bottom: 8px;
}
.brand-badge::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #22d3ee;
  box-shadow: 0 0 8px #22d3ee;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.brand-name {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 22px;
  color: white;
  letter-spacing: -0.02em;
  line-height: 1;
}
.brand-name .dot { color: #22d3ee; }
.brand-sub { font-size: 11px; color: #64748b; margin-top: 4px; }

.nav-section { padding: 12px 0; }
.nav-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: #475569;
  padding: 8px 20px 4px;
  text-transform: uppercase;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px;
  font-size: 13px;
  font-weight: 500;
  color: #94a3b8;
  cursor: pointer;
  border-left: 2px solid transparent;
  background: transparent;
  border-top: none;
  border-right: none;
  border-bottom: none;
  width: 100%;
  text-align: left;
  transition: background 0.15s;
  font-family: inherit;
}
.nav-item:hover { background: rgba(255,255,255,0.03); color: white; }
.nav-item.active {
  color: #22d3ee;
  border-left-color: #22d3ee;
  background: linear-gradient(90deg, rgba(34,211,238,0.12), transparent);
}
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.nav-item .label { flex: 1; }
.nav-item .badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  background: rgba(34,211,238,0.15);
  color: #22d3ee;
  border-radius: 3px;
}

.program-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 20px 5px 40px;
  font-size: 12px;
  color: #94a3b8;
  cursor: pointer;
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
}
.program-item:hover { background: rgba(255,255,255,0.03); color: white; }
.program-item .dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: rgba(148, 163, 184, 0.5);
  flex-shrink: 0;
}
.program-item .count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: #64748b;
}

.sidebar-footer {
  margin-top: auto;
  padding: 12px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: #64748b;
  line-height: 1.6;
}
.sidebar-footer .settings-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  margin: -6px 0 6px;
  border-radius: 3px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  color: #94a3b8;
  cursor: pointer;
  font-size: 10px;
  font-family: inherit;
  width: 100%;
  text-align: left;
}
.sidebar-footer .settings-btn:hover { background: rgba(255,255,255,0.05); color: white; }
.sidebar-footer .settings-btn.has-key { color: #34d399; border-color: rgba(52,211,153,0.3); }

/* ============= BUTTONS ============= */
.btn {
  padding: 8px 14px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 0.02em;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: #22d3ee; color: #050914; }
.btn-primary:hover:not(:disabled) { background: #67e8f9; }
.btn-secondary {
  background: transparent;
  color: #cbd5e1;
  border-color: rgba(255,255,255,0.14);
}
.btn-secondary:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.25); }
.btn-danger {
  background: rgba(239,68,68,0.1);
  color: #f87171;
  border-color: rgba(239,68,68,0.3);
}
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn svg { width: 14px; height: 14px; }
.btn-lg { padding: 10px 20px; font-size: 14px; }

/* ============= CARDS ============= */
.card { background: #141e40; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 16px; }
.paste-area {
  background: #0d1936;
  border: 1px solid rgba(255,255,255,0.14);
  color: #e2e8f0;
  transition: all 0.15s;
  width: 100%;
  padding: 20px 24px;
  font-family: 'Noto Serif KR', serif;
  font-size: 14px;
  line-height: 1.8;
  border-radius: 8px;
  resize: vertical;
  outline: none;
}
.paste-area:focus {
  border-color: #22d3ee;
  box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
}

/* ============= HIGHLIGHTS ============= */
.hl-error {
  background: rgba(239, 68, 68, 0.2);
  border-bottom: 2px wavy #f87171;
  padding: 1px 3px;
  border-radius: 2px;
  cursor: help;
}
.hl-warn {
  background: rgba(251, 191, 36, 0.2);
  border-bottom: 2px wavy #fbbf24;
  padding: 1px 3px;
  border-radius: 2px;
  cursor: help;
}
.hl-suggest {
  background: rgba(59, 130, 246, 0.15);
  border-bottom: 2px dotted #3b82f6;
  padding: 1px 3px;
  border-radius: 2px;
  cursor: help;
}

/* ============= CHIPS ============= */
.chip {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 500;
  margin: 2px 4px 2px 0;
  font-family: 'IBM Plex Mono', monospace;
  border: 1px solid;
}
.chip.cyan { background: rgba(0,180,216,0.15); color: #22d3ee; border-color: rgba(0,180,216,0.3); }
.chip.emerald { background: rgba(52,211,153,0.15); color: #34d399; border-color: rgba(52,211,153,0.3); }
.chip.amber { background: rgba(251,191,36,0.15); color: #fbbf24; border-color: rgba(251,191,36,0.3); }
.chip.purple { background: rgba(147,51,234,0.15); color: #c084fc; border-color: rgba(147,51,234,0.3); }
.chip.blue { background: rgba(0,75,141,0.25); color: #60a5fa; border-color: rgba(0,75,141,0.5); }
.chip.slate { background: rgba(148,163,184,0.1); color: #cbd5e1; border-color: rgba(148,163,184,0.2); }

/* ============= FINDING CARDS ============= */
.finding {
  padding: 12px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.08);
  border-left: 3px solid;
  border-radius: 4px;
  margin-bottom: 8px;
}
.finding.error { border-left-color: #f87171; }
.finding.warn { border-left-color: #fbbf24; }
.finding.suggest { border-left-color: #3b82f6; }
.finding-type {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.finding.error .finding-type { color: #f87171; }
.finding.warn .finding-type { color: #fbbf24; }
.finding.suggest .finding-type { color: #3b82f6; }
.finding-text {
  font-size: 12px;
  color: white;
  font-weight: 500;
  margin-bottom: 4px;
}
.finding-text .strike { color: #f87171; text-decoration: line-through; font-family: 'Noto Serif KR', serif; }
.finding-text .fix { color: #34d399; font-weight: 700; font-family: 'Noto Serif KR', serif; }
.finding-reason { color: #94a3b8; font-size: 11px; }

/* ============= HEADER BARS ============= */
.top-bar {
  padding: 14px 32px;
  background: #0a1128;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.step-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: #64748b;
  letter-spacing: 0.15em;
}

/* ============= CHECK VIEW SPLIT ============= */
.check-split {
  display: grid;
  grid-template-columns: 1fr 380px;
  flex: 1;
  overflow: hidden;
}
.paper-view {
  padding: 32px;
  background: #faf7ef;
  color: #1a1a2e;
  overflow-y: auto;
}
.paper-content {
  max-width: 720px;
  margin: 0 auto;
  font-family: 'Noto Serif KR', serif;
  font-size: 14px;
  line-height: 1.85;
}
.paper-content .cg-line {
  color: #64748b;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 2px 0;
}
.paper-content .cg-line .cg-marker { color: #00B4D8; font-weight: 700; }
.paper-content .speaker-line { margin-top: 10px; padding: 2px 0; }
.paper-content .speaker-line .speaker {
  font-weight: 700;
  color: #00B4D8;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
}
.paper-content .header-line {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: #6b7280;
  padding: 2px 0;
}
.paper-content .career-line {
  font-size: 12px;
  color: #6b7280;
  padding-left: 16px;
}
.paper-content p, .paper-content div { margin: 0; }

.findings-panel {
  background: #0a1128;
  border-left: 1px solid rgba(255,255,255,0.08);
  padding: 20px;
  overflow-y: auto;
}
.stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}
.stat {
  padding: 10px;
  border-left: 2px solid;
  border-radius: 3px;
}
.stat.error { background: rgba(239,68,68,0.05); border-color: #f87171; }
.stat.warn { background: rgba(251,191,36,0.05); border-color: #fbbf24; }
.stat.suggest { background: rgba(59,130,246,0.05); border-color: #3b82f6; }
.stat .n {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  color: white;
}
.stat .lbl { font-size: 10px; letter-spacing: 0.05em; margin-top: 2px; }
.stat.error .lbl { color: #f87171; }
.stat.warn .lbl { color: #fbbf24; }
.stat.suggest .lbl { color: #60a5fa; }

/* ============= FORM FIELDS ============= */
.field-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 12px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.field-row .field-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: #64748b;
}
.field-input, select.field-input {
  background: #0d1936;
  color: white;
  border: 1px solid rgba(255,255,255,0.14);
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 3px;
  width: 100%;
  font-family: 'Noto Sans KR', sans-serif;
}
.field-input:focus { outline: none; border-color: #22d3ee; }

/* ============= SECTION TITLE ============= */
.section-title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.section-title svg { width: 12px; height: 12px; color: #22d3ee; }
.section-title .lbl {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: #22d3ee;
  text-transform: uppercase;
}

/* ============= STOCK VIEW GRID ============= */
.stock-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.cg-stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.cg-stat-cell {
  padding: 8px;
  background: rgba(255,255,255,0.02);
  border-radius: 3px;
  text-align: center;
}
.cg-stat-cell .n {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 20px;
  font-weight: 700;
}
.cg-stat-cell .lbl { color: #94a3b8; font-size: 10px; margin-top: 2px; }

/* ============= ARCHIVE ============= */
.archive-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
}
.archive-card {
  padding: 16px;
  background: #141e40;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  color: inherit;
  font-family: inherit;
  text-align: left;
  font-size: inherit;
}
.archive-card:hover {
  border-color: #22d3ee;
  transform: translateY(-1px);
}
.archive-card .card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.archive-card .card-date {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: #64748b;
}
.archive-card .card-corner {
  font-family: 'Noto Serif KR', serif;
  font-size: 15px;
  font-weight: 700;
  color: white;
  margin-bottom: 4px;
  line-height: 1.3;
}
.archive-card .card-guest {
  color: #94a3b8;
  font-size: 12px;
  margin-bottom: 8px;
}
.archive-card .card-stats {
  display: flex;
  gap: 12px;
  font-size: 10px;
  color: #64748b;
  font-family: 'IBM Plex Mono', monospace;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.05);
}

/* ============= MODAL ============= */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal {
  background: #0a1128;
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 8px;
  padding: 32px;
  max-width: 520px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal h2 {
  font-family: 'Noto Serif KR', serif;
  font-size: 20px;
  font-weight: 800;
  color: white;
  margin-bottom: 8px;
}
.modal p { color: #94a3b8; font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
.modal input {
  background: #0d1936;
  color: white;
  border: 1px solid rgba(255,255,255,0.14);
  padding: 10px 14px;
  font-size: 13px;
  border-radius: 4px;
  width: 100%;
  font-family: 'IBM Plex Mono', monospace;
  margin-bottom: 12px;
}
.modal input:focus { outline: none; border-color: #22d3ee; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

/* ============= LOADING ============= */
.loading-spin {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(34,211,238,0.2);
  border-top-color: #22d3ee;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeIn 0.25s ease; }

/* ============= EMPTY STATE ============= */
.empty-state {
  padding: 80px 32px;
  text-align: center;
}
.empty-state .icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 16px;
  opacity: 0.3;
  color: #64748b;
}
.empty-state .title {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  color: #94a3b8;
  margin-bottom: 8px;
}
.empty-state .desc { color: #64748b; font-size: 13px; }

/* ============= FILE UPLOAD ============= */
.upload-dropzone {
  border: 2px dashed rgba(0,180,216,0.4);
  border-radius: 8px;
  padding: 32px;
  text-align: center;
  background: rgba(0,180,216,0.03);
  margin-bottom: 20px;
  transition: all 0.15s;
  cursor: pointer;
}
.upload-dropzone:hover, .upload-dropzone.dragover {
  border-color: #22d3ee;
  background: rgba(34,211,238,0.08);
}
.upload-dropzone-icon {
  width: 40px;
  height: 40px;
  margin: 0 auto 8px;
  color: #22d3ee;
}
.upload-dropzone-title {
  font-size: 14px;
  color: white;
  font-weight: 600;
  margin-bottom: 4px;
}
.upload-dropzone-sub {
  font-size: 11px;
  color: #64748b;
  font-family: 'IBM Plex Mono', monospace;
}
.upload-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  color: #64748b;
  font-size: 11px;
  font-family: 'IBM Plex Mono', monospace;
}
.upload-divider::before, .upload-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.08);
}

/* ============= NOTIFICATION ============= */
.notify {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #141e40;
  border: 1px solid rgba(52,211,153,0.4);
  color: #34d399;
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 13px;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  animation: fadeIn 0.25s ease;
}
.notify.err { border-color: rgba(239,68,68,0.4); color: #f87171; }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- rendered by JS -->
</div>

<!-- Icons (Lucide) as SVG symbols for reuse -->
<svg style="display:none">
  <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>

// ==============================================================
// PARSER — 실제 원고 포맷 기반
// ==============================================================
function parseManuscript(rawText) {
  const text = String(rawText || '').replace(/\r\n/g, '\n');
  const lines = text.split('\n');

  const result = {
    program: null, corner: null, cornerNo: null, airTime: null, duration: null,
    mc: null,
    guest: { name: null, affiliation: null, title: null, career: [] },
    questions: [],
    cgDirectives: { title: [], guestTag: [], sub: [], super: [], bottom: [], whole: [], ppt: [] },
    programMatch: null,
    stats: { lines: 0, questions: 0, cgTotal: 0, charCount: text.length }
  };

  const cornerHeaderRe = /^\s*#?\s*(\d+)?\s*\(?(\d{1,2}:\d{2})\s*[~\-∼]\s*(\d{1,2}:\d{2})\)?/;
  const durationRe = /\((\d+)\s*[′''`]\)/;
  const arrowCornerRe = /^▶\s*(.+)$/;
  const cornerTitleRe = /^(좌상단|좌상단S)\s*>\s*(.*)$/;
  const guestTagRe = /^(우측네임|좌측네임|네임S)\s*>\s*(.+)$/;
  const subRe = /^서브(?:\s*\([12]단\))?\s*>\s*(.*)$/;
  const superRe = /^수퍼\s*>\s*(.*)$/;
  const bottomRe = /^하단S?\s*>\s*(.*)$/;
  const wholeRe = /^(?:월백|통CG|월백\s*통CG|월백S)\s*>\s*(.*)$/;
  const pptRe = /^PPT\s*(\d+)\s*>\s*(.*)$/;
  const careerRe = /^(現|前)\s+(.+)$/;
  const speakerRe = /^([가-힣]{2,4})\s*(?:\/|>>)/;
  const qMarkerRe = /\((질문[\d\-]+|추가질문[\d\-]+)\)/;
  const qSungtooRe = /^(?:Q\.|\d+\.)\s*(.+)$/;

  const titleSuffixes = ['수석연구위원', '연구위원', '본부장', '센터장', '이코노미스트', '대표', '이사', '팀장', '부장', '교수', '위원', '전무', '상무', '실장'];

  function parseGuestInfo(guestStr) {
    const s = guestStr.trim();
    let title = null; let rest = s;
    for (const suf of titleSuffixes) {
      if (s.endsWith(suf)) { title = suf; rest = s.slice(0, -suf.length).trim(); break; }
    }
    const parts = rest.split(/\s+/);
    if (parts.length === 0) return { name: s, affiliation: null, title };
    return { name: parts[0], affiliation: parts.slice(1).join(' ') || null, title };
  }

  let questionBlock = null;
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trim();
    if (!line) continue;

    const chMatch = line.match(cornerHeaderRe);
    if (chMatch && !result.airTime) {
      if (chMatch[1]) result.cornerNo = '#' + chMatch[1];
      result.airTime = chMatch[2] + '~' + chMatch[3];
      const durMatch = line.match(durationRe);
      if (durMatch) result.duration = durMatch[1];
    }
    const durOnlyMatch = line.match(durationRe);
    if (durOnlyMatch && !result.duration) result.duration = durOnlyMatch[1];

    const arMatch = line.match(arrowCornerRe);
    if (arMatch && !result.corner) result.corner = arMatch[1].trim();

    const ctMatch = line.match(cornerTitleRe);
    if (ctMatch) {
      result.cgDirectives.title.push(ctMatch[2] || '(다음 줄)');
      if (!result.corner && ctMatch[2]) result.corner = ctMatch[2].trim();
      else if (!result.corner && !ctMatch[2] && i + 1 < lines.length) result.corner = lines[i + 1].trim();
    }
    if (!result.corner && durOnlyMatch) {
      const c = line.replace(durationRe, '').trim();
      if (c && c.length < 20 && !/[><]/.test(c)) result.corner = c;
    }

    const gtMatch = line.match(guestTagRe);
    if (gtMatch) {
      const s = gtMatch[2].trim();
      const parsed = parseGuestInfo(s);
      if (parsed.name && !result.guest.name) {
        result.guest.name = parsed.name;
        result.guest.affiliation = parsed.affiliation;
        result.guest.title = parsed.title;
      }
      result.cgDirectives.guestTag.push(s);
    }

    const carMatch = line.match(careerRe);
    if (carMatch) result.guest.career.push(line);

    let m;
    if ((m = line.match(subRe))) result.cgDirectives.sub.push(m[1] || '');
    if ((m = line.match(superRe))) result.cgDirectives.super.push(m[1] || '');
    if ((m = line.match(bottomRe))) result.cgDirectives.bottom.push(m[1] || '');
    if ((m = line.match(wholeRe))) result.cgDirectives.whole.push(m[1] || '');
    if ((m = line.match(pptRe))) result.cgDirectives.ppt.push({ num: m[1], desc: m[2] || '' });

    const spMatch = line.match(speakerRe);
    if (spMatch && KNOWN_MCS.includes(spMatch[1]) && !result.mc) result.mc = spMatch[1];

    const qMatch = line.match(qMarkerRe);
    if (qMatch) { questionBlock = { marker: qMatch[1], text: '' }; continue; }
    if (questionBlock) {
      if (speakerRe.test(line) || /답변|인사|내용 정리/.test(line) || line.startsWith('서브') || line.startsWith('수퍼')) {
        if (questionBlock.text.trim()) result.questions.push({ marker: questionBlock.marker, text: questionBlock.text.trim().slice(0, 200) });
        questionBlock = null;
      } else {
        questionBlock.text += ' ' + line;
      }
    }

    const qsMatch = line.match(qSungtooRe);
    if (qsMatch && qsMatch[1].length > 10) {
      result.questions.push({ marker: 'Q' + (result.questions.length + 1), text: qsMatch[1].slice(0, 200) });
    }
  }
  if (questionBlock && questionBlock.text.trim()) {
    result.questions.push({ marker: questionBlock.marker, text: questionBlock.text.trim().slice(0, 200) });
  }

  if (result.corner) {
    if (/내일 전략|하우스\s*뷰|디코딩\s*마켓|전략\s*인사이드|넥스트\s*시그널|복선/.test(result.corner)) {
      result.programMatch = 'sungtoo';
      if (!result.program) result.program = '성공투자 오후증시';
    }
    if (/매크로\s*인사이트|전략적\s*투자|포트폴리오\s*플러스/.test(result.corner)) {
      if (!result.program) {
        if (/포트폴리오/.test(result.corner)) result.program = '출발증시 2부';
        else result.program = '마켓인사이트';
      }
    }
    if (/K.?스탁|k.?stock/i.test(result.corner)) {
      if (!result.program) result.program = 'K스탁 라이브';
    }
  }

  result.stats.lines = lines.filter(l => l.trim()).length;
  result.stats.questions = result.questions.length;
  result.stats.cgTotal = result.cgDirectives.sub.length + result.cgDirectives.super.length +
    result.cgDirectives.bottom.length + result.cgDirectives.whole.length + result.cgDirectives.ppt.length;
  return result;
}

// ==============================================================
// BASIC CHECKS
// ==============================================================
function runBasicChecks(text) {
  const issues = [];
  const rules = [
    { re: /되요/g, fix: '돼요', type: 'error', reason: '맞춤법: 되→돼' },
    { re: /어떻해/g, fix: '어떻게 해', type: 'error', reason: '맞춤법' },
    { re: /갯수/g, fix: '개수', type: 'error', reason: '표준어' },
    { re: /설겆이/g, fix: '설거지', type: 'error', reason: '맞춤법' },
    { re: /할께/g, fix: '할게', type: 'error', reason: '맞춤법' },
    { re: /뵈요/g, fix: '봬요', type: 'error', reason: '맞춤법' },
    { re: /며칠간/g, fix: '며칠 간', type: 'warn', reason: '띄어쓰기 검토' },
    { re: /으로써/g, fix: '으로서', type: 'suggest', reason: '문맥 확인 (으로써: 수단 / 으로서: 자격)' },
    { re: /  +/g, fix: ' ', type: 'warn', reason: '중복 공백' },
    { re: /같아요\./g, fix: '같습니다.', type: 'suggest', reason: '방송 어투 · 존대 종결' },
    { re: /(\d)억\s*원/g, fix: '$1억 원', type: 'warn', reason: '띄어쓰기 규정' },
    { re: /삼셍전자/g, fix: '삼성전자', type: 'error', reason: '종목명 오타' }
  ];
  for (const rule of rules) {
    let match;
    const re = new RegExp(rule.re.source, rule.re.flags);
    while ((match = re.exec(text)) !== null) {
      if (match[0] === rule.fix) continue;
      issues.push({
        type: rule.type, layer: 'L1/L2',
        offset: match.index, length: match[0].length,
        text: match[0], suggestion: rule.fix, reason: rule.reason
      });
    }
  }
  issues.sort((a, b) => a.offset - b.offset);
  const out = []; let lastEnd = -1;
  for (const iss of issues) {
    if (iss.offset >= lastEnd) { out.push(iss); lastEnd = iss.offset + iss.length; }
  }
  return out;
}

// ==============================================================
// AI CHECK — 서버 프록시 호출 (/api/check)
// ==============================================================
async function runAICheck(text) {
  const resp = await fetch("/api/check", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
    throw new Error(err.error || `서버 응답 오류 (${resp.status})`);
  }
  const data = await resp.json();
  return data.checks || [];
}

async function runAIExtract(text) {
  const resp = await fetch("/api/extract", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
    throw new Error(err.error || `서버 응답 오류 (${resp.status})`);
  }
  const data = await resp.json();
  return data.extract;
}

// ==============================================================
// HELPERS
// ==============================================================
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function icon(id, size) {
  size = size || 14;
  return `<svg width="${size}" height="${size}"><use href="#${id}"/></svg>`;
}

function showNotify(msg, isError) {
  const el = document.createElement('div');
  el.className = 'notify' + (isError ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function renderFinding(check) {
  const cls = check.type;
  const typeLabel = cls === 'error' ? '오류' : cls === 'warn' ? '경고' : '제안';
  return `
    <div class="finding ${cls} fade-in">
      <div class="finding-type">${esc(check.layer || 'L1')} · ${typeLabel}</div>
      <div class="finding-text">
        <span class="strike">${esc(check.text)}</span>
        ${icon('i-right', 10)}
        <span class="fix">${esc(check.suggestion)}</span>
      </div>
      <div class="finding-reason">${esc(check.reason)}</div>
    </div>
  `;
}

function renderHighlightedText(text, checks) {
  // Simple highlighting: replace check.text globally
  let html = esc(text);
  const sorted = [...checks].filter(c => c.text).sort((a, b) => (b.text?.length || 0) - (a.text?.length || 0));
  for (const chk of sorted) {
    if (!chk.text) continue;
    const cls = chk.type === 'error' ? 'hl-error' : chk.type === 'warn' ? 'hl-warn' : 'hl-suggest';
    const escText = esc(chk.text);
    const escedForRegex = escText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(escedForRegex, 'g');
    html = html.replace(re, `<mark class="${cls}" title="${esc(chk.reason || '')}">${escText}</mark>`);
  }
  // Split into lines
  const lines = html.split('\n');
  return lines.map(line => {
    const trimmed = line.trim();
    if (!trimmed) return '<div style="height:8px"></div>';
    // Strip mark tags for pattern testing
    const stripped = trimmed.replace(/<[^>]+>/g, '');

    // CG directive line
    if (/^(좌상단|우측네임|좌측네임|네임S|서브|수퍼|하단S|월백|통CG|PPT)/.test(stripped)) {
      return `<div class="cg-line">${line.replace(/^([^>]+&gt;)/, '<span class="cg-marker">$1</span>')}</div>`;
    }
    // Header line
    if (/^#\d/.test(stripped) || /^\(?\d{1,2}:\d{2}/.test(stripped)) {
      return `<div class="header-line">${line}</div>`;
    }
    // Career line
    if (/^(現|前)/.test(stripped)) {
      return `<div class="career-line">${line}</div>`;
    }
    // Speaker line
    const sMatch = line.match(/^(\s*[가-힣]{2,4}\s*(?:\/|&gt;&gt;)+)(.*)$/);
    if (sMatch && /^[가-힣]{2,4}\s*[\/>]/.test(stripped)) {
      return `<div class="speaker-line"><span class="speaker">${sMatch[1]}</span><span>${sMatch[2]}</span></div>`;
    }
    return `<div style="padding:2px 0">${line}</div>`;
  }).join('');
}

// ==============================================================
// EVENT HANDLERS
// ==============================================================
function attachHandlers() {
  // Nav
  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.nav;
      if (btn.dataset.program) state.filterProgram = btn.dataset.program;
      if (v === 'archive' && !btn.dataset.program) state.filterProgram = 'all';
      if (v === 'upload') resetUploadState();
      state.view = v;
      renderApp();
    });
  });

  // Upload paste tracking
  const pasteEl = document.getElementById('paste-input');
  if (pasteEl) {
    pasteEl.addEventListener('input', (e) => {
      const c = e.target.value.length;
      document.getElementById('paste-count').textContent = c.toLocaleString() + ' 자';
      document.getElementById('submit-btn').disabled = c < 30;
    });
  }

  // File upload — dropzone
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  if (dropzone && fileInput) {
    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f) handleFileUpload(f);
    });
    ['dragover', 'dragenter'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); });
    });
    dropzone.addEventListener('drop', (e) => {
      const f = e.dataTransfer.files[0];
      if (f) handleFileUpload(f);
    });
  }

  // Actions
  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const a = btn.dataset.action;
      switch (a) {
        case 'load-sample':
          document.getElementById('paste-input').value = SAMPLE_TEXT;
          document.getElementById('paste-count').textContent = SAMPLE_TEXT.length.toLocaleString() + ' 자';
          document.getElementById('submit-btn').disabled = false;
          break;
        case 'submit-upload': handleSubmitUpload(); break;
        case 'back-upload': state.view = 'upload'; renderApp(); break;
        case 'back-check': state.view = 'check'; renderApp(); break;
        case 'back-archive': state.currentDetail = null; state.view = 'archive'; renderApp(); break;
        case 'goto-stock':
          state.editedProgram = state.manuscript.parsed.program || '';
          state.editedCorner = state.manuscript.parsed.corner || '';
          state.editedDate = new Date().toISOString().slice(0, 10);
          state.view = 'stock'; renderApp();
          break;
        case 'run-ai-check': await handleRunAICheck(); break;
        case 'run-ai-extract': await handleRunAIExtract(); break;
        case 'save-stock': handleSaveStock(); break;
        case 'open-detail':
          state.currentDetail = btn.dataset.id;
          state.currentDetailData = null;
          state.confirmDelete = false;
          state.view = 'detail'; renderApp();
          // 비동기 로드
          fetchManuscript(btn.dataset.id).then(data => {
            state.currentDetailData = data;
            renderApp();
          });
          break;
        case 'request-delete': state.confirmDelete = true; renderApp(); break;
        case 'cancel-delete': state.confirmDelete = false; renderApp(); break;
        case 'confirm-delete': handleDelete(); break;
      }
    });
  });

  // Stock edit inputs
  const editProg = document.getElementById('edit-program');
  if (editProg) editProg.addEventListener('change', (e) => { state.editedProgram = e.target.value; });
  const editCorner = document.getElementById('edit-corner');
  if (editCorner) editCorner.addEventListener('input', (e) => { state.editedCorner = e.target.value; });
  const editDate = document.getElementById('edit-date');
  if (editDate) editDate.addEventListener('change', (e) => { state.editedDate = e.target.value; });

  // Archive filter
  const filterEl = document.getElementById('filter-program');
  if (filterEl) filterEl.addEventListener('change', (e) => {
    state.filterProgram = e.target.value;
    renderApp();
  });

  // Search
  const searchEl = document.getElementById('search-input');
  if (searchEl) searchEl.addEventListener('input', (e) => {
    state.searchQuery = e.target.value;
    // don't rerender everything, just update results panel
    renderApp();
    // restore focus
    const restored = document.getElementById('search-input');
    if (restored) { restored.focus(); restored.setSelectionRange(e.target.value.length, e.target.value.length); }
  });
}

function resetUploadState() {
  state.manuscript = null;
  state.checks = [];
  state.aiChecks = null;
  state.aiExtract = null;
}

// ---------- FILE UPLOAD HANDLERS ----------
async function handleFileUpload(file) {
  const name = file.name.toLowerCase();
  const pasteEl = document.getElementById('paste-input');
  if (!pasteEl) return;

  try {
    let text = '';

    if (name.endsWith('.docx')) {
      showNotify('DOCX 파싱 중...');
      const arrayBuffer = await file.arrayBuffer();
      // mammoth.js 로 텍스트 추출
      if (typeof mammoth === 'undefined') {
        showNotify('DOCX 라이브러리 로드 실패 — 새로고침 후 재시도', true);
        return;
      }
      const result = await mammoth.extractRawText({ arrayBuffer });
      text = result.value;
      showNotify(`${file.name} 로드 완료 (${text.length.toLocaleString()}자)`);
    } else if (name.endsWith('.txt') || name.endsWith('.md')) {
      text = await file.text();
      showNotify(`${file.name} 로드 완료`);
    } else if (name.endsWith('.hwp') || name.endsWith('.hwpx')) {
      showNotify('HWP 자동 파싱 미지원 — HWP 열어서 텍스트를 복사한 뒤 붙여넣어 주세요', true);
      return;
    } else {
      showNotify('DOCX·TXT 만 지원됩니다', true);
      return;
    }

    if (!text || text.trim().length < 20) {
      showNotify('파일에서 텍스트를 추출하지 못했습니다', true);
      return;
    }

    pasteEl.value = text;
    // 문자 카운트 업데이트 & 버튼 활성화
    document.getElementById('paste-count').textContent = text.length.toLocaleString() + ' 자';
    document.getElementById('submit-btn').disabled = text.length < 30;
  } catch (e) {
    console.error(e);
    showNotify('파일 파싱 실패: ' + e.message, true);
  }
}

function handleSubmitUpload() {
  const text = document.getElementById('paste-input').value;
  if (!text || text.trim().length < 30) return;
  const parsed = parseManuscript(text);
  state.manuscript = { raw: text, parsed };
  state.checks = runBasicChecks(text);
  state.aiChecks = null;
  state.aiExtract = null;
  state.view = 'check';
  renderApp();
}

async function handleRunAICheck() {
  if (!state.manuscript) return;
  state.aiCheckLoading = true; renderApp();
  try {
    const res = await runAICheck(state.manuscript.raw);
    state.aiChecks = res || [];
    showNotify(`AI 검수 완료 · ${res.length}건 지적`);
  } catch (e) {
    console.error(e);
    showNotify('AI 검수 실패: ' + e.message, true);
    state.aiChecks = [];
  } finally {
    state.aiCheckLoading = false; renderApp();
  }
}

async function handleRunAIExtract() {
  if (!state.manuscript) return;
  state.aiExtractLoading = true; renderApp();
  try {
    const res = await runAIExtract(state.manuscript.raw);
    state.aiExtract = res;
    showNotify('AI 추출 완료');
  } catch (e) {
    console.error(e);
    showNotify('AI 추출 실패: ' + e.message, true);
  } finally {
    state.aiExtractLoading = false; renderApp();
  }
}

async function handleSaveStock() {
  if (!state.manuscript) return;
  const p = state.manuscript.parsed;
  const entry = {
    program: state.editedProgram,
    corner: state.editedCorner || p.corner,
    airDate: state.editedDate,
    airTime: p.airTime,
    duration: p.duration,
    guest: p.guest?.name || null,
    guestAffiliation: p.guest?.affiliation || null,
    mc: p.mc,
    questionCount: p.questions.length,
    cgCount: p.stats.cgTotal,
    charCount: p.stats.charCount,
    tickers: state.aiExtract?.tickers || [],
    events: state.aiExtract?.events || [],
    sectors: state.aiExtract?.sectors || [],
    organizations: state.aiExtract?.organizations || [],
    raw: state.manuscript.raw,
    parsed: p,
    aiExtract: state.aiExtract
  };
  try {
    const saved = await saveManuscript(entry);
    showNotify(`STOCK 저장 완료 · "${entry.corner}"`);
    // 서버에서 다시 목록 로드
    state.archive = await fetchArchive();
    resetUploadState();
    state.view = 'archive';
    renderApp();
  } catch (e) {
    showNotify('저장 실패: ' + e.message, true);
  }
}

async function handleDelete() {
  if (!state.currentDetail) return;
  try {
    await deleteManuscript(state.currentDetail);
    state.archive = state.archive.filter(m => m.id !== state.currentDetail);
    showNotify('원고 삭제됨');
  } catch (e) {
    showNotify('삭제 실패: ' + e.message, true);
  }
  state.currentDetail = null;
  state.confirmDelete = false;
  state.view = 'archive';
  renderApp();
}

// ==============================================================
// INIT
// ==============================================================
async function init() {
  renderApp();
  // 서버에서 아카이브 로드
  try {
    state.archive = await fetchArchive();
    renderApp();
  } catch (e) {
    console.error(e);
    showNotify('아카이브 로드 실패 - 새로고침 시도', true);
  }
}
init();
</script>
