<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRSCRIPT · 방송 원고 자동검수 & STOCK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
/* ============= RESET ============= */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: #f7f3e9;
  color: #1a2b3d;
  line-height: 1.6;
  overflow: hidden;
}

/* ============= UTILS ============= */
.serif { font-family: 'Noto Serif KR', serif; font-feature-settings: "palt"; }
.mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
.display { font-family: 'Inter', 'Noto Sans KR', sans-serif; }

.text-cyan { color: #1e3a5f; }
.text-hcyan { color: #1e3a5f; }
.text-hblue { color: #2563eb; }
.text-amber { color: #b45309; }
.text-red { color: #b91c1c; }
.text-emerald { color: #059669; }
.text-muted { color: #4a5670; }
.text-mute2 { color: #7d8590; }

.scroll-y { overflow-y: auto; }
.scroll-y::-webkit-scrollbar { width: 8px; }
.scroll-y::-webkit-scrollbar-track { background: transparent; }
.scroll-y::-webkit-scrollbar-thumb { background: rgba(30,43,61,0.15); border-radius: 4px; }
.scroll-y::-webkit-scrollbar-thumb:hover { background: rgba(30,43,61,0.3); }

/* ============= LAYOUT ============= */
.app { display: flex; height: 100vh; }
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: #efe7d5;
  border-right: 1px solid rgba(30,43,61,0.1);
  display: flex;
  flex-direction: column;
}
.main { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: #f7f3e9; }

/* ============= SIDEBAR ============= */
.brand-block {
  padding: 20px 20px 16px;
  border-bottom: 1px solid rgba(30,43,61,0.1);
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: #c65f3f;
  margin-bottom: 8px;
}
.brand-badge::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #c65f3f;
  box-shadow: 0 0 6px rgba(198,95,63,0.5);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.brand-name {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  font-size: 22px;
  color: #1a2b3d;
  letter-spacing: -0.02em;
  line-height: 1;
}
.brand-name .dot { color: #c65f3f; }
.brand-sub { font-size: 11px; color: #6b7280; margin-top: 4px; }

.nav-section { padding: 12px 0; }
.nav-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: #8b8578;
  padding: 8px 20px 4px;
  text-transform: uppercase;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px;
  font-size: 13px;
  font-weight: 500;
  color: #4a5670;
  cursor: pointer;
  border-left: 2px solid transparent;
  background: transparent;
  border-top: none;
  border-right: none;
  border-bottom: none;
  width: 100%;
  text-align: left;
  transition: background 0.15s;
  font-family: inherit;
}
.nav-item:hover { background: rgba(30,43,61,0.04); color: #1a2b3d; }
.nav-item.active {
  color: #1e3a5f;
  border-left-color: #1e3a5f;
  background: rgba(30,58,95,0.08);
  font-weight: 600;
}
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.nav-item .label { flex: 1; }
.nav-item .badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  background: rgba(198,95,63,0.15);
  color: #c65f3f;
  border-radius: 3px;
}

.program-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 20px 5px 40px;
  font-size: 12px;
  color: #4a5670;
  cursor: pointer;
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
}
.program-item:hover { background: rgba(30,43,61,0.04); color: #1a2b3d; }
.program-item .dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: rgba(30,43,61,0.3);
  flex-shrink: 0;
}
.program-item .count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: #7d8590;
}

.sidebar-footer {
  margin-top: auto;
  padding: 14px 20px;
  border-top: 1px solid rgba(30,43,61,0.1);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: #6b7280;
  line-height: 1.7;
}
.sidebar-footer .settings-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  margin: -2px 0 10px;
  border-radius: 3px;
  background: transparent;
  border: 1px solid rgba(30,43,61,0.1);
  color: #4a5670;
  cursor: pointer;
  font-size: 10px;
  font-family: inherit;
  width: 100%;
  text-align: left;
}
.sidebar-footer .settings-btn:hover { background: rgba(30,43,61,0.04); color: #1a2b3d; }
.sidebar-footer .settings-btn.has-key { color: #059669; border-color: rgba(5,150,105,0.3); background: rgba(5,150,105,0.06); }

/* ============= BUTTONS ============= */
.btn {
  padding: 8px 14px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 0.02em;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: #1e3a5f; color: #ffffff; }
.btn-primary:hover:not(:disabled) { background: #2a4d7a; }
.btn-secondary {
  background: transparent;
  color: #1a2b3d;
  border-color: rgba(30,43,61,0.2);
}
.btn-secondary:hover { background: rgba(30,43,61,0.05); border-color: rgba(30,43,61,0.35); }
.btn-danger {
  background: rgba(185,28,28,0.08);
  color: #b91c1c;
  border-color: rgba(185,28,28,0.25);
}
.btn-danger:hover { background: rgba(185,28,28,0.15); }
.btn-accent {
  background: #c65f3f;
  color: #ffffff;
}
.btn-accent:hover:not(:disabled) { background: #b04d30; }
.btn svg { width: 14px; height: 14px; }
.btn-lg { padding: 10px 20px; font-size: 14px; }

/* ============= CARDS ============= */
.card {
  background: #ffffff;
  border: 1px solid rgba(30,43,61,0.08);
  border-radius: 6px;
  padding: 16px;
  box-shadow: 0 1px 3px rgba(30,43,61,0.04);
}
.paste-area {
  background: #ffffff;
  border: 1px solid rgba(30,43,61,0.15);
  color: #1a2b3d;
  transition: all 0.15s;
  width: 100%;
  padding: 20px 24px;
  font-family: 'Noto Serif KR', serif;
  font-size: 14px;
  line-height: 1.8;
  border-radius: 8px;
  resize: vertical;
  outline: none;
  box-shadow: 0 1px 3px rgba(30,43,61,0.04);
}
.paste-area:focus {
  border-color: #1e3a5f;
  box-shadow: 0 0 0 3px rgba(30,58,95,0.12);
}

/* ============= HIGHLIGHTS ============= */
.hl-error {
  background: rgba(185,28,28,0.12);
  border-bottom: 2px wavy #b91c1c;
  padding: 1px 3px;
  border-radius: 2px;
  cursor: help;
}
.hl-warn {
  background: rgba(180,83,9,0.12);
  border-bottom: 2px wavy #b45309;
  padding: 1px 3px;
  border-radius: 2px;
  cursor: help;
}
.hl-suggest {
  background: rgba(37,99,235,0.1);
  border-bottom: 2px dotted #2563eb;
  padding: 1px 3px;
  border-radius: 2px;
  cursor: help;
}

/* ============= CHIPS ============= */
.chip {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 500;
  margin: 2px 4px 2px 0;
  font-family: 'IBM Plex Mono', monospace;
  border: 1px solid;
}
.chip.cyan { background: rgba(30,58,95,0.08); color: #1e3a5f; border-color: rgba(30,58,95,0.2); }
.chip.emerald { background: rgba(5,150,105,0.08); color: #059669; border-color: rgba(5,150,105,0.25); }
.chip.amber { background: rgba(180,83,9,0.08); color: #b45309; border-color: rgba(180,83,9,0.25); }
.chip.purple { background: rgba(124,58,237,0.08); color: #7c3aed; border-color: rgba(124,58,237,0.25); }
.chip.blue { background: rgba(37,99,235,0.08); color: #2563eb; border-color: rgba(37,99,235,0.25); }
.chip.slate { background: rgba(30,43,61,0.06); color: #4a5670; border-color: rgba(30,43,61,0.15); }
.chip.coral { background: rgba(198,95,63,0.1); color: #c65f3f; border-color: rgba(198,95,63,0.3); }

/* ============= FINDING CARDS ============= */
.finding {
  padding: 12px;
  background: #ffffff;
  border: 1px solid rgba(30,43,61,0.08);
  border-left: 3px solid;
  border-radius: 4px;
  margin-bottom: 8px;
}
.finding.error { border-left-color: #b91c1c; }
.finding.warn { border-left-color: #b45309; }
.finding.suggest { border-left-color: #2563eb; }
.finding-type {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}
.finding.error .finding-type { color: #b91c1c; }
.finding.warn .finding-type { color: #b45309; }
.finding.suggest .finding-type { color: #2563eb; }
.finding-text {
  font-size: 12px;
  color: #1a2b3d;
  font-weight: 500;
  margin-bottom: 4px;
}
.finding-text .strike { color: #b91c1c; text-decoration: line-through; font-family: 'Noto Serif KR', serif; }
.finding-text .fix { color: #059669; font-weight: 700; font-family: 'Noto Serif KR', serif; }
.finding-reason { color: #6b7280; font-size: 11px; }

/* ============= HEADER BARS ============= */
.top-bar {
  padding: 14px 32px;
  background: #f0eadc;
  border-bottom: 1px solid rgba(30,43,61,0.1);
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.step-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: #7d8590;
  letter-spacing: 0.15em;
}

/* ============= CHECK VIEW SPLIT ============= */
.check-split {
  display: grid;
  grid-template-columns: 1fr 400px;
  flex: 1;
  overflow: hidden;
}
.paper-view {
  padding: 32px;
  background: #ffffff;
  color: #1a2b3d;
  overflow-y: auto;
}
.paper-content {
  max-width: 720px;
  margin: 0 auto;
  font-family: 'Noto Serif KR', serif;
  font-size: 14px;
  line-height: 1.85;
}
.paper-content .cg-line {
  color: #7d8590;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  padding: 2px 0;
}
.paper-content .cg-line .cg-marker { color: #1e3a5f; font-weight: 700; }
.paper-content .speaker-line { margin-top: 10px; padding: 2px 0; }
.paper-content .speaker-line .speaker {
  font-weight: 700;
  color: #1e3a5f;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
}
.paper-content .header-line {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: #7d8590;
  padding: 2px 0;
}
.paper-content .career-line {
  font-size: 12px;
  color: #7d8590;
  padding-left: 16px;
}
.paper-content p, .paper-content div { margin: 0; }

.findings-panel {
  background: #f0eadc;
  border-left: 1px solid rgba(30,43,61,0.1);
  padding: 20px;
  overflow-y: auto;
}
.stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}
.stat {
  padding: 10px;
  border-left: 2px solid;
  border-radius: 3px;
  background: #ffffff;
}
.stat.error { border-color: #b91c1c; }
.stat.warn { border-color: #b45309; }
.stat.suggest { border-color: #2563eb; }
.stat .n {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  color: #1a2b3d;
}
.stat .lbl { font-size: 10px; letter-spacing: 0.05em; margin-top: 2px; }
.stat.error .lbl { color: #b91c1c; }
.stat.warn .lbl { color: #b45309; }
.stat.suggest .lbl { color: #2563eb; }

/* ============= FORM FIELDS ============= */
.field-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 12px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(30,43,61,0.06);
}
.field-row .field-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: #6b7280;
}
.field-input, select.field-input {
  background: #ffffff;
  color: #1a2b3d;
  border: 1px solid rgba(30,43,61,0.15);
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 3px;
  width: 100%;
  font-family: 'Noto Sans KR', sans-serif;
}
.field-input:focus { outline: none; border-color: #1e3a5f; box-shadow: 0 0 0 2px rgba(30,58,95,0.1); }

/* ============= SECTION TITLE ============= */
.section-title {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.section-title svg { width: 12px; height: 12px; color: #1e3a5f; }
.section-title .lbl {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: #1e3a5f;
  text-transform: uppercase;
}

/* ============= STOCK VIEW GRID ============= */
.stock-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.cg-stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.cg-stat-cell {
  padding: 8px;
  background: #f7f3e9;
  border-radius: 3px;
  text-align: center;
  border: 1px solid rgba(30,43,61,0.06);
}
.cg-stat-cell .n {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 20px;
  font-weight: 700;
}
.cg-stat-cell .lbl { color: #6b7280; font-size: 10px; margin-top: 2px; }

/* ============= ARCHIVE ============= */
.archive-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
}
.archive-card {
  padding: 16px;
  background: #ffffff;
  border: 1px solid rgba(30,43,61,0.08);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
  color: inherit;
  font-family: inherit;
  text-align: left;
  font-size: inherit;
  box-shadow: 0 1px 3px rgba(30,43,61,0.04);
}
.archive-card:hover {
  border-color: #1e3a5f;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(30,43,61,0.08);
}
.archive-card .card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.archive-card .card-date {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: #7d8590;
}
.archive-card .card-corner {
  font-family: 'Noto Serif KR', serif;
  font-size: 15px;
  font-weight: 700;
  color: #1a2b3d;
  margin-bottom: 4px;
  line-height: 1.3;
}
.archive-card .card-guest {
  color: #4a5670;
  font-size: 12px;
  margin-bottom: 8px;
}
.archive-card .card-stats {
  display: flex;
  gap: 12px;
  font-size: 10px;
  color: #7d8590;
  font-family: 'IBM Plex Mono', monospace;
  padding-top: 8px;
  border-top: 1px solid rgba(30,43,61,0.06);
}

/* ============= LOADING ============= */
.loading-spin {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(30,58,95,0.2);
  border-top-color: #1e3a5f;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeIn 0.25s ease; }

/* ============= EMPTY STATE ============= */
.empty-state {
  padding: 80px 32px;
  text-align: center;
}
.empty-state .icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 16px;
  opacity: 0.4;
  color: #7d8590;
}
.empty-state .title {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  color: #4a5670;
  margin-bottom: 8px;
}
.empty-state .desc { color: #7d8590; font-size: 13px; }

/* ============= NOTIFICATION ============= */
.notify {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #ffffff;
  border: 1px solid rgba(5,150,105,0.4);
  color: #059669;
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 13px;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(30,43,61,0.12);
  animation: fadeIn 0.25s ease;
}
.notify.err { border-color: rgba(185,28,28,0.4); color: #b91c1c; }

/* ============= FILE UPLOAD ============= */
.upload-dropzone {
  border: 2px dashed rgba(30,58,95,0.3);
  border-radius: 8px;
  padding: 32px;
  text-align: center;
  background: rgba(30,58,95,0.03);
  margin-bottom: 20px;
  transition: all 0.15s;
  cursor: pointer;
}
.upload-dropzone:hover, .upload-dropzone.dragover {
  border-color: #1e3a5f;
  background: rgba(30,58,95,0.06);
}
.upload-dropzone-icon {
  width: 40px;
  height: 40px;
  margin: 0 auto 8px;
  color: #1e3a5f;
}
.upload-dropzone-title {
  font-size: 14px;
  color: #1a2b3d;
  font-weight: 600;
  margin-bottom: 4px;
}
.upload-dropzone-sub {
  font-size: 11px;
  color: #7d8590;
  font-family: 'IBM Plex Mono', monospace;
}
.upload-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
  color: #7d8590;
  font-size: 11px;
  font-family: 'IBM Plex Mono', monospace;
}
.upload-divider::before, .upload-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(30,43,61,0.1);
}

/* ============= MULTI-CORNER SELECTOR ============= */
.corner-selector {
  background: rgba(198,95,63,0.06);
  border: 1px solid rgba(198,95,63,0.25);
  border-radius: 6px;
  padding: 16px;
  margin-bottom: 20px;
}
.corner-selector-title {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: #c65f3f;
  font-weight: 700;
  margin-bottom: 12px;
}
.corner-list { display: flex; flex-direction: column; gap: 8px; }
.corner-item {
  background: #ffffff;
  padding: 10px 14px;
  border-radius: 4px;
  border: 1px solid rgba(30,43,61,0.08);
  display: grid;
  grid-template-columns: 30px 1fr auto;
  gap: 10px;
  align-items: center;
}
.corner-item .num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: #c65f3f;
  font-weight: 700;
}
.corner-item .name {
  font-family: 'Noto Serif KR', serif;
  font-weight: 700;
  color: #1a2b3d;
}
.corner-item .meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: #7d8590;
}

/* ============= SCHEDULE (주간 편성) ============= */
.schedule-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 32px;
  background: #f0eadc;
  border-bottom: 1px solid rgba(30,43,61,0.1);

// ==============================================================

// PARSER — 다중 코너 분리 + 다중 게스트 수집
// ==============================================================

// 코너 경계 감지 - ▶ 표시나 표 헤더로 시작하는 라인을 코너 시작으로 인식
function detectCornerBoundaries(text) {
  const lines = text.split('\n');
  const boundaries = [];
  const arrowRe = /^▶\s*(.+)$/;
  const bracketCornerRe = /^\[([^\]]{2,15})\]$/;  // [마감], [복선] 등 (짧은 코너명만)
  const cornerHeaderRe = /^\s*#\s*\d+\s*\((\d{1,2}:\d{2})/;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    if (arrowRe.test(line) || cornerHeaderRe.test(line) || bracketCornerRe.test(line)) {
      // 코너명이 너무 흔한 단어면 스킵 (예: [답변], [인사])
      const cornerName = (line.match(arrowRe)?.[1] || line.match(bracketCornerRe)?.[1] || '').trim();
      if (/^(답변|인사|질문\d*|정리|내용|CG)$/.test(cornerName)) continue;
      boundaries.push(i);
    }
  }

  if (boundaries.length <= 1) {
    return [{ text, startLine: 0 }];
  }

  const segments = [];
  for (let i = 0; i < boundaries.length; i++) {
    const start = boundaries[i];
    const end = i < boundaries.length - 1 ? boundaries[i + 1] : lines.length;
    segments.push({
      text: lines.slice(start, end).join('\n'),
      startLine: start
    });
  }
  return segments;
}

// 개별 세그먼트 파싱
function parseSegmentText(rawText) {
  const text = String(rawText || '').replace(/\r\n/g, '\n');
  const lines = text.split('\n');

  const result = {
    program: null, corner: null, cornerNo: null, airTime: null, duration: null,
    mc: null,
    guests: [],  // 다중 게스트 배열
    guest: { name: null, affiliation: null, title: null, career: [] },  // 호환용 (첫 번째 게스트)
    questions: [],
    cgDirectives: { title: [], guestTag: [], sub: [], super: [], bottom: [], whole: [], ppt: [] },
    programMatch: null,
    rawText: text,
    stats: { lines: 0, questions: 0, cgTotal: 0, charCount: text.length }
  };

  const cornerHeaderRe = /^\s*#?\s*(\d+)?\s*\(?(\d{1,2}:\d{2})\s*[~\-∼]\s*(\d{1,2}:\d{2})\)?/;
  const durationRe = /\((\d+)\s*[′''`]\)/;
  const arrowCornerRe = /^▶\s*(.+)$/;
  const bracketCornerRe = /^\[([^\]]{2,15})\]$/;
  const cornerTitleRe = /^(좌상단|좌상단S)\s*>\s*(.*)$/;
  const guestTagRe = /^(우측네임|좌측네임|네임S)\s*>\s*(.+)$/;
  const subRe = /^서브(?:\s*\([12]단\))?\s*>\s*(.*)$/;
  const superRe = /^수퍼\s*>\s*(.*)$/;
  const bottomRe = /^하단S?\s*>\s*(.*)$/;
  const wholeRe = /^(?:월백|통CG|월백\s*통CG|월백S)\s*>\s*(.*)$/;
  const pptRe = /^PPT\s*(\d+)\s*>\s*(.*)$/;
  const careerRe = /^(現|前)\s+(.+)$/;
  const speakerRe = /^([가-힣]{2,4})\s*(?:\/|>>)/;
  const qMarkerRe = /\((질문[\d\-]+|추가질문[\d\-]+)\)/;
  const qSungtooRe = /^(?:Q\.|\d+\.)\s*(.+)$/;

  const titleSuffixes = ['수석연구위원', '연구위원', '본부장', '센터장', '이코노미스트', '대표', '이사', '팀장', '부장', '교수', '위원', '전무', '상무', '실장', '차장', '과장', '소장', '지점장', '리서치센터장', '연구원', '기자', '앵커', 'PB'];

  function parseGuestInfo(guestStr) {
    const s = guestStr.trim();
    let title = null; let rest = s;
    for (const suf of titleSuffixes) {
      if (s.endsWith(suf)) { title = suf; rest = s.slice(0, -suf.length).trim(); break; }
    }
    const parts = rest.split(/\s+/);
    if (parts.length === 0) return { name: s, affiliation: null, title };
    return { name: parts[0], affiliation: parts.slice(1).join(' ') || null, title };
  }

  let currentGuest = null;  // career 라인 부착용
  let questionBlock = null;

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trim();
    if (!line) continue;

    // 방송 시간대·러닝타임
    const chMatch = line.match(cornerHeaderRe);
    if (chMatch && !result.airTime) {
      if (chMatch[1]) result.cornerNo = '#' + chMatch[1];
      result.airTime = chMatch[2] + '~' + chMatch[3];
      const durMatch = line.match(durationRe);
      if (durMatch) result.duration = durMatch[1];
    }
    const durOnlyMatch = line.match(durationRe);
    if (durOnlyMatch && !result.duration) result.duration = durOnlyMatch[1];

    // 코너명 감지 (▶ / [코너명] / 좌상단>)
    const arMatch = line.match(arrowCornerRe);
    if (arMatch && !result.corner) result.corner = arMatch[1].trim();

    const brMatch = line.match(bracketCornerRe);
    if (brMatch && !result.corner) {
      const c = brMatch[1].trim();
      if (!/^(답변|인사|질문\d*|정리|내용|CG)$/.test(c)) result.corner = c;
    }

    const ctMatch = line.match(cornerTitleRe);
    if (ctMatch) {
      result.cgDirectives.title.push(ctMatch[2] || '(다음 줄)');
      if (!result.corner && ctMatch[2]) result.corner = ctMatch[2].trim();
      else if (!result.corner && !ctMatch[2] && i + 1 < lines.length) result.corner = lines[i + 1].trim();
    }
    if (!result.corner && durOnlyMatch) {
      const c = line.replace(durationRe, '').trim();
      if (c && c.length < 20 && !/[><]/.test(c)) result.corner = c;
    }

    // 게스트 태그 (다중 수집)
    const gtMatch = line.match(guestTagRe);
    if (gtMatch) {
      const s = gtMatch[2].trim();
      const parsed = parseGuestInfo(s);
      if (parsed.name) {
        // 이미 있는 이름이면 중복 스킵
        const exists = result.guests.some(g => g.name === parsed.name);
        if (!exists) {
          currentGuest = { ...parsed, career: [], raw: s };
          result.guests.push(currentGuest);
        }
      }
      result.cgDirectives.guestTag.push(s);
    }

    // 이력 라인 - 현재 게스트에 부착
    const carMatch = line.match(careerRe);
    if (carMatch && currentGuest) {
      currentGuest.career.push(line);
    }

    // CG 지시어
    let m;
    if ((m = line.match(subRe))) result.cgDirectives.sub.push(m[1] || '');
    if ((m = line.match(superRe))) result.cgDirectives.super.push(m[1] || '');
    if ((m = line.match(bottomRe))) result.cgDirectives.bottom.push(m[1] || '');
    if ((m = line.match(wholeRe))) result.cgDirectives.whole.push(m[1] || '');
    if ((m = line.match(pptRe))) result.cgDirectives.ppt.push({ num: m[1], desc: m[2] || '' });

    // MC 감지
    const spMatch = line.match(speakerRe);
    if (spMatch && KNOWN_MCS.includes(spMatch[1]) && !result.mc) result.mc = spMatch[1];

    // 질문 감지
    const qMatch = line.match(qMarkerRe);
    if (qMatch) { questionBlock = { marker: qMatch[1], text: '' }; continue; }
    if (questionBlock) {
      if (speakerRe.test(line) || /답변|인사|내용 정리/.test(line) || line.startsWith('서브') || line.startsWith('수퍼')) {
        if (questionBlock.text.trim()) result.questions.push({ marker: questionBlock.marker, text: questionBlock.text.trim().slice(0, 200) });
        questionBlock = null;
      } else {
        questionBlock.text += ' ' + line;
      }
    }

    const qsMatch = line.match(qSungtooRe);
    if (qsMatch && qsMatch[1].length > 10) {
      result.questions.push({ marker: 'Q' + (result.questions.length + 1), text: qsMatch[1].slice(0, 200) });
    }
  }
  if (questionBlock && questionBlock.text.trim()) {
    result.questions.push({ marker: questionBlock.marker, text: questionBlock.text.trim().slice(0, 200) });
  }

  // 호환용: 첫 게스트를 top-level guest 로도 설정
  if (result.guests.length > 0) {
    const first = result.guests[0];
    result.guest = {
      name: first.name,
      affiliation: first.affiliation,
      title: first.title,
      career: first.career
    };
  }

  // 프로그램 매칭 (규칙 강화)
  if (result.corner) {
    const c = result.corner;
    if (/내일 전략|하우스\s*뷰|디코딩\s*마켓|전략\s*인사이드|넥스트\s*시그널|복선|마감|위클리뷰/.test(c)) {
      result.programMatch = 'sungtoo';
      if (!result.program) result.program = '성공투자 오후증시';
    }
    if (/매크로\s*인사이트|전략적\s*투자/.test(c)) {
      if (!result.program) result.program = '마켓인사이트';
    }
    if (/포트폴리오\s*플러스/.test(c)) {
      if (!result.program) result.program = '출발증시 2부';
    }
    if (/K.?스탁|k.?stock/i.test(c)) {
      if (!result.program) result.program = 'K스탁 라이브';
    }
    if (/글로벌\s*마켓|굿모닝\s*한경|해외증시\s*브리핑/.test(c)) {
      if (!result.program) result.program = '굿모닝 한경 글로벌마켓';
    }
  }

  result.stats.lines = lines.filter(l => l.trim()).length;
  result.stats.questions = result.questions.length;
  result.stats.cgTotal = result.cgDirectives.sub.length + result.cgDirectives.super.length +
    result.cgDirectives.bottom.length + result.cgDirectives.whole.length + result.cgDirectives.ppt.length;
  return result;
}

// 메인 파서 - 다중 코너 감지 후 각 세그먼트 파싱
function parseManuscript(rawText) {
  const text = String(rawText || '').replace(/\r\n/g, '\n');
  const segments = detectCornerBoundaries(text);

  // 각 세그먼트 파싱
  const parsedSegments = segments.map(seg => parseSegmentText(seg.text));

  // 첫 세그먼트를 top-level 로 노출 (호환성 유지) + segments 배열도 함께
  const result = {
    ...parsedSegments[0],
    segments: parsedSegments,
    isMultiCorner: parsedSegments.length > 1
  };
  return result;
}

// ==============================================================
// BASIC CHECKS
// ==============================================================
function runBasicChecks(text) {
  const issues = [];
  const rules = [
    { re: /되요/g, fix: '돼요', type: 'error', reason: '맞춤법: 되→돼' },
    { re: /어떻해/g, fix: '어떻게 해', type: 'error', reason: '맞춤법' },
    { re: /갯수/g, fix: '개수', type: 'error', reason: '표준어' },
    { re: /설겆이/g, fix: '설거지', type: 'error', reason: '맞춤법' },
    { re: /할께/g, fix: '할게', type: 'error', reason: '맞춤법' },
    { re: /뵈요/g, fix: '봬요', type: 'error', reason: '맞춤법' },
    { re: /며칠간/g, fix: '며칠 간', type: 'warn', reason: '띄어쓰기 검토' },
    { re: /으로써/g, fix: '으로서', type: 'suggest', reason: '문맥 확인 (으로써: 수단 / 으로서: 자격)' },
    { re: /  +/g, fix: ' ', type: 'warn', reason: '중복 공백' },
    { re: /같아요\./g, fix: '같습니다.', type: 'suggest', reason: '방송 어투 · 존대 종결' },
    { re: /(\d)억\s*원/g, fix: '$1억 원', type: 'warn', reason: '띄어쓰기 규정' },
    { re: /삼셍전자/g, fix: '삼성전자', type: 'error', reason: '종목명 오타' }
  ];
  for (const rule of rules) {
    let match;
    const re = new RegExp(rule.re.source, rule.re.flags);
    while ((match = re.exec(text)) !== null) {
      if (match[0] === rule.fix) continue;
      issues.push({
        type: rule.type, layer: 'L1/L2',
        offset: match.index, length: match[0].length,
        text: match[0], suggestion: rule.fix, reason: rule.reason
      });
    }
  }
  issues.sort((a, b) => a.offset - b.offset);
  const out = []; let lastEnd = -1;
  for (const iss of issues) {
    if (iss.offset >= lastEnd) { out.push(iss); lastEnd = iss.offset + iss.length; }
  }
  return out;
}

// ==============================================================
// AI CHECK — 서버 프록시 호출 (/api/check)
// ==============================================================
async function runAICheck(text) {
  const resp = await fetch("/api/check", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
    throw new Error(err.error || `서버 응답 오류 (${resp.status})`);
  }
  const data = await resp.json();
  return { checks: data.checks || [], source: data.source || "unknown", diagnostics: data.diagnostics || [] };
}

async function runAIExtract(text) {
  const resp = await fetch("/api/extract", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
    throw new Error(err.error || `서버 응답 오류 (${resp.status})`);
  }
  const data = await resp.json();
  return data.extract;
}

// HELPERS
// ==============================================================
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function icon(id, size) {
  size = size || 14;
  return `<svg width="${size}" height="${size}"><use href="#${id}"/></svg>`;
}

function showNotify(msg, isError) {
  const el = document.createElement('div');
  el.className = 'notify' + (isError ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function renderFinding(check) {
  const cls = check.type;
  const typeLabel = cls === 'error' ? '오류' : cls === 'warn' ? '경고' : '제안';
  return `
    <div class="finding ${cls} fade-in">
      <div class="finding-type">${esc(check.layer || 'L1')} · ${typeLabel}</div>
      <div class="finding-text">
        <span class="strike">${esc(check.text)}</span>
        ${icon('i-right', 10)}
        <span class="fix">${esc(check.suggestion)}</span>
      </div>
      <div class="finding-reason">${esc(check.reason)}</div>
    </div>
  `;
}

function renderHighlightedText(text, checks) {
  // Simple highlighting: replace check.text globally
  let html = esc(text);
  const sorted = [...checks].filter(c => c.text).sort((a, b) => (b.text?.length || 0) - (a.text?.length || 0));
  for (const chk of sorted) {
    if (!chk.text) continue;
    const cls = chk.type === 'error' ? 'hl-error' : chk.type === 'warn' ? 'hl-warn' : 'hl-suggest';
    const escText = esc(chk.text);
    const escedForRegex = escText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(escedForRegex, 'g');
    html = html.replace(re, `<mark class="${cls}" title="${esc(chk.reason || '')}">${escText}</mark>`);
  }
  // Split into lines
  const lines = html.split('\n');
  return lines.map(line => {
    const trimmed = line.trim();
    if (!trimmed) return '<div style="height:8px"></div>';
    // Strip mark tags for pattern testing
    const stripped = trimmed.replace(/<[^>]+>/g, '');

    // CG directive line
    if (/^(좌상단|우측네임|좌측네임|네임S|서브|수퍼|하단S|월백|통CG|PPT)/.test(stripped)) {
      return `<div class="cg-line">${line.replace(/^([^>]+&gt;)/, '<span class="cg-marker">$1</span>')}</div>`;
    }
    // Header line
    if (/^#\d/.test(stripped) || /^\(?\d{1,2}:\d{2}/.test(stripped)) {
      return `<div class="header-line">${line}</div>`;
    }
    // Career line
    if (/^(現|前)/.test(stripped)) {
      return `<div class="career-line">${line}</div>`;
    }
    // Speaker line
    const sMatch = line.match(/^(\s*[가-힣]{2,4}\s*(?:\/|&gt;&gt;)+)(.*)$/);
    if (sMatch && /^[가-힣]{2,4}\s*[\/>]/.test(stripped)) {
      return `<div class="speaker-line"><span class="speaker">${sMatch[1]}</span><span>${sMatch[2]}</span></div>`;
    }
    return `<div style="padding:2px 0">${line}</div>`;
  }).join('');
}

// ==============================================================
// SCHEDULE — 주간 편성 (파서 + 스토리지 + 렌더러 + 드로어)
// ==============================================================

const DAY_NAMES = ['월', '화', '수', '목', '금'];

function getMondayOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function toISODate(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function getWeekDates(mondayIso) {
  const monday = new Date(mondayIso);
  return Array.from({ length: 5 }, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

function formatDateShort(d) {
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

// -------- 스케줄 파서 (다양한 톡방 포맷 지원) --------
//
// 지원 포맷:
//   1) 마인:   [마켓 인사이트] 다음주 스케줄 → "포트폴리오 플러스" (텍스트 코너) → 월/ 이름 소속
//   2) 머플:   <머니플러스 다음주 일정> → [주도주를 만드는 이슈] (브래킷 코너) → (월) → 이름
//   3) 워치:   [마켓워치] 다음주 스케줄 → 월) 이름 소속
//   4) K스탁:  [다음주 K스탁] → 월> → -코너명 → : 이름 or -코너명 : 이름
//   5) 성투:   [성투 - 다음주 스케줄] → 7/27 (월) → [코너명] → 이름
//
// Hierarchy 자동감지: 프로그램 첫 헤더가 요일이면 'day-first',
// 코너면 'corner-first'. 각 모드에 따라 요일/코너 변경 시 상대 필드 리셋.

function parseScheduleText(text) {
  const lines = text.split('\n').map(l => l.trim());
  const entries = [];   // { program, day, corner, guest }
  const unmatched = []; // 파싱 실패 항목

  const DAY_NAMES = ['월', '화', '수', '목', '금'];

  let currentProgram = null;
  let currentCorner = null;
  let currentDay = null;
  let hierarchyMode = null;  // 'day-first' | 'corner-first' | null

  // 프로그램 헤더 패턴 (스케줄/일정/편성 키워드 필수 아님, 하지만 있으면 확실)
  const progHeaderRegexes = [
    /^\[다음주\s+([^\]]+)\]$/,                                    // [다음주 K스탁]
    /^\[([^\]]+?)\]\s*(?:다음주|이번주|주간|주간)?\s*(?:스케줄|일정|편성)/,   // [마켓 인사이트] 다음주 스케줄
    /^\[([^\]]+?)\s*[-–]\s*(?:다음주|이번주|주간)?\s*(?:스케줄|일정|편성)\]/, // [성투 - 다음주 스케줄]
    /^<([^>]+?)>\s*(?:\d{4}[-–]\d{4})?\s*(?:다음주|이번주|주간)?\s*(?:스케줄|일정|편성)?/, // <굿모닝 0727-0731 스케줄>
    /^<([^>]+?)\s+(?:다음주|이번주|주간)?\s*(?:스케줄|일정|편성)>/,   // <머니플러스 다음주 일정>
  ];

  // 날짜 헤더
  const dateWithDayRe = /^(\d{1,2})\/(\d{1,2})\s*\(([월화수목금토일])\)$/;   // 7/27 (월)
  const parenDayRe = /^\(([월화수목금토일])\)$/;                              // (월)
  const closeParenDayRe = /^([월화수목금토일])\)$/;                            // 월)
  const arrowDayRe = /^([월화수목금토일])>$/;                                  // 월>
  const dayWordRe = /^([월화수목금토일])요일$/;                                // 월요일

  // 코너 헤더
  const bracketCornerRe = /^\[([^\]]{2,25})\]$/;
  const arrowCornerRe = /^▶\s*(.+)$/;
  const hyphenCornerColonGuestRe = /^-\s*(.+?)\s*:\s*(.+)$/;   // -리포트 비하인드 : 이해니
  const hyphenCornerOnlyRe = /^-\s*(.+)$/;                       // -증시 숏담화

  // 요일 접두 게스트
  const dayGuestSlashRe = /^([월화수목금토일])\s*\/\s*(.+)$/;    // 월/ 이름 or 월 / 이름
  const dayGuestParenRe = /^([월화수목금토일])\s*\)\s*(.+)$/;    // 월) 이름
  const colonGuestRe = /^[:：]\s*(.+)$/;                          // : 이름

  const titleSuffixes = ['수석연구위원', '연구위원', '부센터장', '부부장', '본부장', '센터장', '이코노미스트', '리서치센터장', '리서치센터', 'PB팀장', 'ETF팀 부장', '포트폴리오 매니저', '대표', '이사', '팀장', '부장', '교수', '위원', '전무', '상무', '실장', '차장', '과장', '소장', '지점장', '연구원', '기자', '앵커', 'PB', '매니저', '뉴욕', '워싱턴', '실리콘밸리', '베이징', '도쿄', '런던', '파리', '홍콩'];
  titleSuffixes.sort((a, b) => b.length - a.length);  // 긴 것부터 매칭

  // 소속에 자주 등장하는 키워드 - 게스트 라인 판별용
  // "투자" 단독은 제외 (예: "전략적 투자" 는 코너명). 대신 "자문", "증권" 등 명확한 소속 표지만 사용.
  const AFFIL_KEYWORDS = [
    '증권', '자문', '자산운용', '은행', '보험', '리서치', '연구소', '연구원', '컨설팅',
    '금융', '캐피탈', '뱅크', '컴퍼니', '인베스트먼트', '펀드', '자문단', '경제연구',
    'KB', 'LS', 'NH', 'SK', 'DS', 'iM', 'IBK', 'BNK', 'JB', 'DGB', 'MG',
    '삼성', '한화', '미래에셋', '메리츠', '한국투자', '신한', '하나', '우리', '농협', '기업은행',
    'Prestige', '와이즈', '유안타', '유진', '유경', '유니스토리', '타임폴리오', '레그넘', '위즈웨이브',
    '이코노미스트', 'AMC', 'GFM', '홀딩스', '전문가', '경영전략', '벤투스', '그레너리', '현명',
    '엠디', '주머니', '다이와', '체슬리', '렉스셰어즈', '위즈', '퍼스트프라임', '한국경제', '모멘텀트리'
  ];
  function hasAffilKeyword(text) {
    if (!text) return false;
    return AFFIL_KEYWORDS.some(k => text.includes(k));
  }

  function normalizeProgramName(raw) {
    if (!raw) return null;
    const r = raw.trim();
    if (/성공투자|성투|오후증시/.test(r)) return '성공투자 오후증시';
    if (/굿모닝|글로벌\s*마켓|한경\s*글로벌/.test(r)) return '굿모닝 한경 글로벌마켓';
    if (/머니플러스|머플/.test(r)) return '머니플러스';
    if (/출발증시\s*1|출발\s*1/.test(r)) return '출발증시 1부';
    if (/출발증시\s*2|출발\s*2/.test(r)) return '출발증시 2부';
    if (/마켓\s*인사이트|마인/.test(r)) return '마켓인사이트';
    if (/K\s*[-·]?\s*스탁|k[-·]?stock|케이스탁/i.test(r)) return 'K스탁 라이브';
    if (/마켓\s*워치/.test(r)) return '마켓워치';
    return null;
  }

  function looksLikeKoreanName(first) {
    return /^[가-힣]{2,4}$/.test(first);
  }

  function parseGuestInfo(str) {
    let s = (str || '').trim();
    if (!s) return null;

    // 뒤에 (분야) or (화상) 등 소괄호 하나 이상 제거
    let mode = null;
    let spec = null;
    let brackets = [];
    let m;
    while ((m = s.match(/\(([^)]+)\)$/))) {
      brackets.push(m[1]);
      s = s.slice(0, m.index).trim();
    }
    if (brackets.length > 0) {
      // 첫 번째 발견: mode 로 간주 (화상, 전화 등 짧은 것)
      // 두 번째: 분야
      for (const b of brackets.reverse()) {
        if (/화상|전화|스튜디오|현장|전화연결/.test(b) && !mode) mode = b;
        else if (!spec) spec = b;
      }
    }

    // 직함 접미어
    let title = null;
    let rest = s;
    for (const suf of titleSuffixes) {
      if (rest.endsWith(suf)) { title = suf; rest = rest.slice(0, -suf.length).trim(); break; }
    }

    const parts = rest.split(/\s+/).filter(Boolean);
    if (parts.length === 0) return null;
    const name = parts[0];
    if (!looksLikeKoreanName(name)) return null;
    return {
      name,
      affiliation: parts.slice(1).join(' ') || null,
      title,
      mode,
      spec
    };
  }

  function setProgram(name) {
    const normalized = normalizeProgramName(name);
    currentProgram = normalized || name.trim();
    currentCorner = null;
    currentDay = null;
    hierarchyMode = null;
  }

  function setDay(day) {
    if (hierarchyMode === null) hierarchyMode = 'day-first';
    if (hierarchyMode === 'day-first') currentCorner = null;  // day 변경 → corner 리셋
    currentDay = day;
  }

  function setCorner(name) {
    if (hierarchyMode === null) hierarchyMode = 'corner-first';
    if (hierarchyMode === 'corner-first') currentDay = null;  // corner 변경 → day 리셋
    currentCorner = name;
  }

  function addEntry(guest) {
    if (!currentProgram || !guest?.name) {
      unmatched.push({ line: guest?.name || '?', program: currentProgram });
      return;
    }
    if (!currentDay) {
      // 요일 미지정 - 코너 아래 요일 없이 게스트 나온 경우 (예: 머플의 [송재호의 골든픽])
      // → 월~금 모두 저장
      for (const d of DAY_NAMES) {
        entries.push({ program: currentProgram, day: d, corner: currentCorner || '', guest });
      }
      return;
    }
    if (!DAY_NAMES.includes(currentDay)) {
      unmatched.push({ line: guest.name, program: currentProgram, day: currentDay });
      return;
    }
    entries.push({ program: currentProgram, day: currentDay, corner: currentCorner || '', guest });
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line) continue;

    // (1) 프로그램 헤더
    let programSet = false;
    for (const re of progHeaderRegexes) {
      const m = line.match(re);
      if (m) {
        // 코너 브래킷과의 혼동 방지: 스케줄/일정/편성 키워드가 라인 안에 있거나
        // 프로그램명 정규화가 되는 경우만 프로그램으로 인식
        const rawName = m[1];
        const hasKeyword = /스케줄|일정|편성|다음주|이번주/.test(line);
        const normalized = normalizeProgramName(rawName);
        if (hasKeyword || normalized) {
          setProgram(rawName);
          programSet = true;
          break;
        }
      }
    }
    if (programSet) continue;

    // (2) 날짜/요일 헤더 (여러 패턴)
    let daySet = false;
    let dm;
    if ((dm = line.match(dateWithDayRe))) { setDay(dm[3]); daySet = true; }
    else if ((dm = line.match(parenDayRe))) { setDay(dm[1]); daySet = true; }
    else if ((dm = line.match(arrowDayRe))) { setDay(dm[1]); daySet = true; }
    else if ((dm = line.match(dayWordRe))) { setDay(dm[1]); daySet = true; }
    // 주의: closeParenDayRe (월)) 는 game with 게스트 포함될 수 있으므로 별도 처리 (아래)
    if (daySet) continue;

    // (3) 요일 접두 게스트 (한 줄에 요일 + 게스트)
    let dgm;
    if ((dgm = line.match(dayGuestSlashRe))) {   // 월/ 이름 소속
      setDay(dgm[1]);
      const guest = parseGuestInfo(dgm[2]);
      if (guest) { addEntry(guest); continue; }
      continue;
    }
    if ((dgm = line.match(dayGuestParenRe))) {   // 월) 이름 소속
      setDay(dgm[1]);
      const guest = parseGuestInfo(dgm[2]);
      if (guest) { addEntry(guest); continue; }
      continue;
    }
    // closeParenDayRe: 단독 월) — 요일만
    if ((dm = line.match(closeParenDayRe))) { setDay(dm[1]); continue; }

    // (4) K스탁 스타일: -코너 : 게스트 (한 줄에 코너+게스트)
    let hcgm;
    if ((hcgm = line.match(hyphenCornerColonGuestRe))) {
      setCorner(hcgm[1].trim());
      const guest = parseGuestInfo(hcgm[2]);
      if (guest) { addEntry(guest); continue; }
      continue;
    }

    // (5) 콜론 접두 게스트: (: 이름)
    let cgm;
    if ((cgm = line.match(colonGuestRe))) {
      const guest = parseGuestInfo(cgm[1]);
      if (guest) { addEntry(guest); continue; }
    }

    // (6) 하이픈 코너 (- 코너명) - 무조건 코너로 처리
    let hcm;
    if ((hcm = line.match(hyphenCornerOnlyRe))) {
      setCorner(hcm[1].trim());
      continue;
    }

    // (7) 브래킷 코너 [코너명]
    let bcm;
    if ((bcm = line.match(bracketCornerRe))) {
      const cornerName = bcm[1].trim();
      if (!/스케줄|일정|편성/.test(cornerName) && !/^(답변|인사|질문\d*|정리|내용|CG)$/.test(cornerName)) {
        setCorner(cornerName);
        continue;
      }
    }

    // (8) 화살표 코너 (▶ 코너명)
    let acm;
    if ((acm = line.match(arrowCornerRe))) {
      setCorner(acm[1].trim());
      continue;
    }

    // (9) 소속 키워드 있는 라인 → 확실한 게스트
    if (hasAffilKeyword(line)) {
      const guest = parseGuestInfo(line);
      if (guest) { addEntry(guest); continue; }
    }

    // (10) 프로그램 컨텍스트에서 짧고 소속 키워드 없는 라인 → 코너 후보
    // (예: "매크로 인사이트", "전략적 투자")
    if (currentProgram && line.length <= 25 && line.length >= 2 && !hasAffilKeyword(line)) {
      setCorner(line);
      continue;
    }

    // (11) 마지막 시도: 이름만 있는 라인 (소속 없는 게스트)
    const guest = parseGuestInfo(line);
    if (guest) {
      addEntry(guest);
      continue;
    }

    // 그 외 - unmatched
    unmatched.push({ line, program: currentProgram, day: currentDay, corner: currentCorner });
  }

  return { entries, unmatched };
}

// -------- 스케줄 스토리지 API --------
async function fetchScheduleWeek(weekMonday) {
  try {
    const resp = await fetch(`/api/schedule/${encodeURIComponent(weekMonday)}`);
    if (!resp.ok) return {};
    const data = await resp.json();
    // 구 포맷 → 신 포맷 마이그레이션
    const entries = data.entries || {};
    for (const key in entries) {
      const v = entries[key];
      if (v && v.corner !== undefined && v.corners === undefined) {
        entries[key] = {
          corners: [{ name: v.corner || '', guests: v.guests || [] }]
        };
      } else if (v && !v.corners) {
        entries[key] = { corners: [] };
      }
    }
    return entries;
  } catch (e) {
    console.error('스케줄 로드 실패', e);
    return {};
  }
}

async function saveScheduleWeek(weekMonday, entries) {
  const resp = await fetch(`/api/schedule/${encodeURIComponent(weekMonday)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ entries })
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return await resp.json();
}

// -------- 스케줄 액션 핸들러 --------
async function loadScheduleWeek(weekMonday) {
  state.scheduleLoading = true;
  state.scheduleWeek = weekMonday;
  renderApp();
  state.scheduleData = await fetchScheduleWeek(weekMonday);
  state.scheduleLoading = false;
  renderApp();
}

function shiftWeek(days) {
  const cur = new Date(state.scheduleWeek || toISODate(getMondayOfWeek(new Date())));
  cur.setDate(cur.getDate() + days);
  loadScheduleWeek(toISODate(cur));
}

function collectDrawerCornersFromDOM() {
  const container = document.getElementById('drawer-corners');
  if (!container) return [];
  const cornerBlocks = container.querySelectorAll('.corner-block');
  const corners = [];
  cornerBlocks.forEach((block, ci) => {
    const nameEl = block.querySelector(`.corner-name-${ci}`);
    const name = nameEl?.value?.trim() || '';
    const guestList = block.querySelector('.guest-list');
    const guests = [];
    if (guestList) {
      const entries = guestList.querySelectorAll('.guest-entry');
      entries.forEach((_, gi) => {
        const gname = block.querySelector(`.g-name-${ci}-${gi}`)?.value?.trim() || '';
        if (!gname) return;
        const gaffil = block.querySelector(`.g-affil-${ci}-${gi}`)?.value?.trim() || null;
        const gtitle = block.querySelector(`.g-title-${ci}-${gi}`)?.value?.trim() || null;
        const gmode = block.querySelector(`.g-mode-${ci}-${gi}`)?.value?.trim() || null;
        guests.push({ name: gname, affiliation: gaffil, title: gtitle, mode: gmode });
      });
    }
    // 코너명이 있거나 게스트가 있을 때만 포함
    if (name || guests.length > 0) {
      corners.push({ name, guests });
    }
  });
  return corners;
}

async function saveScheduleCell() {
  if (!state.scheduleDrawer) return;
  const { program, day } = state.scheduleDrawer;
  const key = scheduleKey(program, day);
  const corners = collectDrawerCornersFromDOM();

  if (corners.length === 0) {
    delete state.scheduleData[key];
  } else {
    state.scheduleData[key] = { corners };
  }

  try {
    await saveScheduleWeek(state.scheduleWeek, state.scheduleData);
    showNotify('저장 완료');
  } catch (e) {
    showNotify('저장 실패: ' + e.message, true);
  }
  state.scheduleDrawer = null;
  renderApp();
}

async function deleteScheduleCell() {
  if (!state.scheduleDrawer) return;
  const { program, day } = state.scheduleDrawer;
  const key = scheduleKey(program, day);
  delete state.scheduleData[key];
  try {
    await saveScheduleWeek(state.scheduleWeek, state.scheduleData);
    showNotify('삭제 완료');
  } catch (e) {
    showNotify('삭제 실패', true);
  }
  state.scheduleDrawer = null;
  renderApp();
}

async function handleParseScheduleImport() {
  const text = document.getElementById('schedule-import-text')?.value || '';
  if (text.trim().length < 20) {
    showNotify('붙여넣은 텍스트가 너무 짧습니다', true);
    return;
  }
  const { entries, unmatched } = parseScheduleText(text);
  if (entries.length === 0) {
    showNotify(`인식된 항목이 없습니다 (미매칭 ${unmatched.length}건 - 콘솔 확인)`, true);
    console.log('[스케줄 파싱] 미매칭 라인:', unmatched);
    return;
  }

  // 기존 스케줄에 병합 (다중 코너 구조)
  for (const e of entries) {
    if (!e.day || !DAY_NAMES.includes(e.day)) continue;
    if (!e.program) continue;

    // 프로그램명 매칭
    const prog = PROGRAMS.find(p => p.name === e.program || p.shortName === e.program);
    const matchedProgram = prog ? prog.name : e.program;

    const key = scheduleKey(matchedProgram, e.day);
    if (!state.scheduleData[key]) {
      state.scheduleData[key] = { corners: [] };
    }
    const corners = state.scheduleData[key].corners;

    // 같은 이름의 코너가 있으면 병합, 없으면 새로 추가
    let cornerObj = corners.find(c => c.name === (e.corner || ''));
    if (!cornerObj) {
      cornerObj = { name: e.corner || '', guests: [] };
      corners.push(cornerObj);
    }
    // 중복 게스트 방지
    if (!cornerObj.guests.some(g => g.name === e.guest.name && g.affiliation === e.guest.affiliation)) {
      cornerObj.guests.push(e.guest);
    }
  }

  try {
    await saveScheduleWeek(state.scheduleWeek, state.scheduleData);
    const msg = `${entries.length}건 반영 완료` + (unmatched.length > 0 ? ` (미매칭 ${unmatched.length}건)` : '');
    showNotify(msg);
    if (unmatched.length > 0) {
      console.log('[스케줄 파싱] 미매칭 라인:', unmatched);
    }
  } catch (e) {
    showNotify('저장 실패', true);
  }

  state.scheduleImportOpen = false;
  renderApp();
}

// ==============================================================
// EVENT HANDLERS
// ==============================================================
function attachHandlers() {
  // Nav
  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.nav;
      if (btn.dataset.program) state.filterProgram = btn.dataset.program;
      if (v === 'archive' && !btn.dataset.program) state.filterProgram = 'all';
      if (v === 'upload') resetUploadState();
      state.view = v;
      renderApp();
      // 스케줄 뷰 진입 시 이번주 데이터 로드
      if (v === 'schedule') {
        const week = state.scheduleWeek || toISODate(getMondayOfWeek(new Date()));
        loadScheduleWeek(week);
      }
    });
  });

  // Upload paste tracking
  const pasteEl = document.getElementById('paste-input');
  if (pasteEl) {
    pasteEl.addEventListener('input', (e) => {
      const c = e.target.value.length;
      document.getElementById('paste-count').textContent = c.toLocaleString() + ' 자';
      document.getElementById('submit-btn').disabled = c < 30;
    });
  }

  // File upload — dropzone
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  if (dropzone && fileInput) {
    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f) handleFileUpload(f);
    });
    ['dragover', 'dragenter'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); });
    });
    dropzone.addEventListener('drop', (e) => {
      const f = e.dataTransfer.files[0];
      if (f) handleFileUpload(f);
    });
  }

  // Actions
  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const a = btn.dataset.action;
      switch (a) {
        case 'load-sample':
          document.getElementById('paste-input').value = SAMPLE_TEXT;
          document.getElementById('paste-count').textContent = SAMPLE_TEXT.length.toLocaleString() + ' 자';
          document.getElementById('submit-btn').disabled = false;
          break;
        case 'submit-upload': handleSubmitUpload(); break;
        case 'back-upload': state.view = 'upload'; renderApp(); break;
        case 'back-check': state.view = 'check'; renderApp(); break;
        case 'back-archive': state.currentDetail = null; state.view = 'archive'; renderApp(); break;
        case 'goto-stock':
          state.currentCornerIndex = 0;
          const firstSeg = state.manuscript.parsed.segments?.[0] || state.manuscript.parsed;
          state.editedProgram = firstSeg.program || '';
          state.editedCorner = firstSeg.corner || '';
          state.editedDate = new Date().toISOString().slice(0, 10);
          state.view = 'stock'; renderApp();
          break;
        case 'select-corner': {
          const idx = parseInt(btn.dataset.idx || '0');
          state.currentCornerIndex = idx;
          const segs = state.manuscript.parsed.segments || [state.manuscript.parsed];
          const seg = segs[idx] || segs[0];
          state.editedProgram = seg.program || '';
          state.editedCorner = seg.corner || '';
          renderApp();
          break;
        }
        case 'run-ai-check': await handleRunAICheck(); break;
        case 'run-ai-extract': await handleRunAIExtract(); break;
        case 'save-stock': handleSaveStock(); break;
        case 'open-detail':
          state.currentDetail = btn.dataset.id;
          state.currentDetailData = null;
          state.confirmDelete = false;
          state.view = 'detail'; renderApp();
          // 비동기 로드
          fetchManuscript(btn.dataset.id).then(data => {
            state.currentDetailData = data;
            renderApp();
          });
          break;
        case 'request-delete': state.confirmDelete = true; renderApp(); break;
        case 'cancel-delete': state.confirmDelete = false; renderApp(); break;
        case 'confirm-delete': handleDelete(); break;

        // ---- 스케줄 관련 ----
        case 'prev-week': shiftWeek(-7); break;
        case 'next-week': shiftWeek(7); break;
        case 'today-week': loadScheduleWeek(toISODate(getMondayOfWeek(new Date()))); break;
        case 'import-schedule':
          state.scheduleImportOpen = true; renderApp(); break;
        case 'close-import':
          state.scheduleImportOpen = false; renderApp(); break;
        case 'parse-schedule-import': await handleParseScheduleImport(); break;
        case 'open-drawer':
          state.scheduleDrawer = { program: btn.dataset.program, day: btn.dataset.day };
          renderApp();
          break;
        case 'close-drawer':
          state.scheduleDrawer = null; renderApp(); break;
        case 'save-drawer': await saveScheduleCell(); break;
        case 'delete-schedule-cell': await deleteScheduleCell(); break;
        case 'add-guest': {
          if (!state.scheduleDrawer) break;
          const cornerIdx = parseInt(btn.dataset.cornerIdx || '0');
          const key = scheduleKey(state.scheduleDrawer.program, state.scheduleDrawer.day);
          // 현재 DOM 값 수집 후 새 게스트 추가
          const currentCorners = collectDrawerCornersFromDOM();
          while (currentCorners.length <= cornerIdx) currentCorners.push({ name: '', guests: [] });
          currentCorners[cornerIdx].guests.push({ name: '', affiliation: '', title: '', mode: '' });
          state.scheduleData[key] = { corners: currentCorners };
          renderApp();
          break;
        }
        case 'remove-guest': {
          if (!state.scheduleDrawer) break;
          const cornerIdx = parseInt(btn.dataset.cornerIdx || '0');
          const gi = parseInt(btn.dataset.idx || '0');
          const key = scheduleKey(state.scheduleDrawer.program, state.scheduleDrawer.day);
          const currentCorners = collectDrawerCornersFromDOM();
          if (currentCorners[cornerIdx]) {
            currentCorners[cornerIdx].guests.splice(gi, 1);
          }
          state.scheduleData[key] = { corners: currentCorners };
          renderApp();
          break;
        }
        case 'add-corner': {
          if (!state.scheduleDrawer) break;
          const key = scheduleKey(state.scheduleDrawer.program, state.scheduleDrawer.day);
          const currentCorners = collectDrawerCornersFromDOM();
          currentCorners.push({ name: '', guests: [] });
          state.scheduleData[key] = { corners: currentCorners };
          renderApp();
          break;
        }
        case 'remove-corner': {
          if (!state.scheduleDrawer) break;
          const cornerIdx = parseInt(btn.dataset.idx || '0');
          const key = scheduleKey(state.scheduleDrawer.program, state.scheduleDrawer.day);
          const currentCorners = collectDrawerCornersFromDOM();
          currentCorners.splice(cornerIdx, 1);
          state.scheduleData[key] = { corners: currentCorners };
          renderApp();
          break;
        }
      }
    });
  });

  // Stock edit inputs
  const editProg = document.getElementById('edit-program');
  if (editProg) editProg.addEventListener('change', (e) => { state.editedProgram = e.target.value; });
  const editCorner = document.getElementById('edit-corner');
  if (editCorner) editCorner.addEventListener('input', (e) => { state.editedCorner = e.target.value; });
  const editDate = document.getElementById('edit-date');
  if (editDate) editDate.addEventListener('change', (e) => { state.editedDate = e.target.value; });

  // Archive filter
  const filterEl = document.getElementById('filter-program');
  if (filterEl) filterEl.addEventListener('change', (e) => {
    state.filterProgram = e.target.value;
    renderApp();
  });

  // Search
  const searchEl = document.getElementById('search-input');
  if (searchEl) searchEl.addEventListener('input', (e) => {
    state.searchQuery = e.target.value;
    // don't rerender everything, just update results panel
    renderApp();
    // restore focus
    const restored = document.getElementById('search-input');
    if (restored) { restored.focus(); restored.setSelectionRange(e.target.value.length, e.target.value.length); }
  });
}

function resetUploadState() {
  state.manuscript = null;
  state.checks = [];
  state.aiChecks = null;
  state.aiExtract = null;
}

// ---------- FILE UPLOAD HANDLERS ----------
async function handleFileUpload(file) {
  const name = file.name.toLowerCase();
  const pasteEl = document.getElementById('paste-input');
  if (!pasteEl) return;

  try {
    let text = '';

    if (name.endsWith('.docx')) {
      showNotify('DOCX 파싱 중...');
      const arrayBuffer = await file.arrayBuffer();
      // mammoth.js 로 텍스트 추출
      if (typeof mammoth === 'undefined') {
        showNotify('DOCX 라이브러리 로드 실패 — 새로고침 후 재시도', true);
        return;
      }
      const result = await mammoth.extractRawText({ arrayBuffer });
      text = result.value;
      showNotify(`${file.name} 로드 완료 (${text.length.toLocaleString()}자)`);
    } else if (name.endsWith('.txt') || name.endsWith('.md')) {
      text = await file.text();
      showNotify(`${file.name} 로드 완료`);
    } else if (name.endsWith('.hwp') || name.endsWith('.hwpx')) {
      showNotify('HWP 자동 파싱 미지원 — HWP 열어서 텍스트를 복사한 뒤 붙여넣어 주세요', true);
      return;
    } else {
      showNotify('DOCX·TXT 만 지원됩니다', true);
      return;
    }

    if (!text || text.trim().length < 20) {
      showNotify('파일에서 텍스트를 추출하지 못했습니다', true);
      return;
    }

    pasteEl.value = text;
    // 문자 카운트 업데이트 & 버튼 활성화
    document.getElementById('paste-count').textContent = text.length.toLocaleString() + ' 자';
    document.getElementById('submit-btn').disabled = text.length < 30;
  } catch (e) {
    console.error(e);
    showNotify('파일 파싱 실패: ' + e.message, true);
  }
}

function handleSubmitUpload() {
  const text = document.getElementById('paste-input').value;
  if (!text || text.trim().length < 30) return;
  const parsed = parseManuscript(text);
  state.manuscript = { raw: text, parsed };
  state.checks = runBasicChecks(text);
  state.aiChecks = null;
  state.aiExtract = null;
  state.view = 'check';
  renderApp();
}

async function handleRunAICheck() {
  if (!state.manuscript) return;
  state.aiCheckLoading = true; renderApp();
  try {
    const res = await runAICheck(state.manuscript.raw);
    state.aiChecks = res.checks || [];
    console.log("[검수 진단]", { source: res.source, diagnostics: res.diagnostics });
    if (res.source === "실패" || (res.checks.length === 0 && res.diagnostics?.some(d => /실패/.test(d)))) {
      showNotify(`검수 서버 접속 실패 - 콘솔(F12) 확인`, true);
    } else {
      showNotify(`${res.source} · ${res.checks.length}건 지적`);
    }
  } catch (e) {
    console.error(e);
    showNotify('검수 실패: ' + e.message, true);
    state.aiChecks = [];
  } finally {
    state.aiCheckLoading = false; renderApp();
  }
}

async function handleRunAIExtract() {
  if (!state.manuscript) return;
  state.aiExtractLoading = true; renderApp();
  try {
    const res = await runAIExtract(state.manuscript.raw);
    state.aiExtract = res;
    showNotify('AI 추출 완료');
  } catch (e) {
    console.error(e);
    showNotify('AI 추출 실패: ' + e.message, true);
  } finally {
    state.aiExtractLoading = false; renderApp();
  }
}

async function handleSaveStock() {
  if (!state.manuscript) return;
  const parsed = state.manuscript.parsed;
  const segments = parsed.segments || [parsed];
  const isMulti = segments.length > 1;

  let savedCount = 0;
  let failedCount = 0;

  for (let i = 0; i < segments.length; i++) {
    const p = segments[i];
    // 현재 편집중인 코너는 사용자 입력 반영
    const isCurrent = i === (state.currentCornerIndex || 0);
    const entry = {
      program: isCurrent ? state.editedProgram : (p.program || ''),
      corner: isCurrent ? (state.editedCorner || p.corner) : (p.corner || ''),
      airDate: state.editedDate,
      airTime: p.airTime,
      duration: p.duration,
      guest: p.guest?.name || null,
      guestAffiliation: p.guest?.affiliation || null,
      guests: (p.guests || []).map(g => ({ name: g.name, affiliation: g.affiliation, title: g.title, career: g.career })),
      mc: p.mc,
      questionCount: p.questions.length,
      cgCount: p.stats.cgTotal,
      charCount: p.stats.charCount,
      tickers: state.aiExtract?.tickers || [],
      events: state.aiExtract?.events || [],
      sectors: state.aiExtract?.sectors || [],
      organizations: state.aiExtract?.organizations || [],
      raw: p.rawText || state.manuscript.raw,
      parsed: p,
      aiExtract: state.aiExtract,
      cornerIndex: isMulti ? i + 1 : null,
      cornerTotal: isMulti ? segments.length : null
    };
    try {
      await saveManuscript(entry);
      savedCount++;
    } catch (e) {
      console.error(`코너 ${i + 1} 저장 실패`, e);
      failedCount++;
    }
  }

  if (savedCount > 0) {
    showNotify(isMulti ? `${savedCount}개 코너 STOCK 저장 완료${failedCount > 0 ? ` (${failedCount}건 실패)` : ''}` : `STOCK 저장 완료`);
    state.archive = await fetchArchive();
    resetUploadState();
    state.view = 'archive';
    renderApp();
  } else {
    showNotify('저장 실패', true);
  }
}

async function handleDelete() {
  if (!state.currentDetail) return;
  try {
    await deleteManuscript(state.currentDetail);
    state.archive = state.archive.filter(m => m.id !== state.currentDetail);
    showNotify('원고 삭제됨');
  } catch (e) {
    showNotify('삭제 실패: ' + e.message, true);
  }
  state.currentDetail = null;
  state.confirmDelete = false;
  state.view = 'archive';
  renderApp();
}

// ==============================================================
// INIT
// ==============================================================
async function init() {
  renderApp();
  // 서버에서 아카이브 로드
  try {
    state.archive = await fetchArchive();
    renderApp();
  } catch (e) {
    console.error(e);
    showNotify('아카이브 로드 실패 - 새로고침 시도', true);
  }
}
init();
</script>
